    <header>

            <img src="img/logo.jpeg" width="100" height="100">
        </div>
        <div class="container">

            <nav align="right">
                <!--Menu-->
                <input type="checkbox" id="check"> <!--um bglh lá no JS-->
                <label for="check">&#x268c;</label>
                <ul>
                    <a href="#Início">Início</a>

                </ul>
            </nav>

        </div>
    </header>
    <main>
      <h1>Finalizar Pagamento</h1>
      <br><h3><em>Você pagará:</em></h3>

    <table border="1">
        <tr>
         <td><em>Item</em></td>
         <td><em>Valor</em></td>
        </tr>
        <tr>
         <td>x1 Combo Costela</td>
         <td>R$ 40,90</td>
        </tr>
        <tr>
         <td>x1 Porção Coxinha (6 Unidades)</td>
         <td>R$ 18,90</td>
        </tr>
        <tr>
         <td>x1 Milkshake Nutella</td>
         <td>R$ 19,90</td><br>
        <tr>
        <td><em>Total</em></td>
        <td>R$ 79,70</td>
        </tr>
    </table>
 <div> 
     <article>
      <br><br><form action="/cadastro" method="get">
            <fieldset>
                <legend><em>Dados para o pagamento</em></legend><br>
                <label for="nome">Nome completo</label>
                <input 
                 type="text"
                 id="nome"
                 nome = "nome"
                 placeholder="Digite seu nome">
                <br><br><label for="cpf">CPF na Nota (Opcional)</label>
                <input 
                 type="number"
                 id = "Pagamento"
                 name="Pagamento"
                 pattern="[0-9]{6}"
                 placeholder="Somente Números"
                 required>
                <br><br><select id="curso" nome="curso">
                    <option value="Pix">Pix</option>
                    <option value="Cartão D">Cartão de Débito</option>
                    <option value="Cartão C">Cartão de Crédito</option>
                </select>
            </fieldset>
     </article>
 </div>

    <a href="comprovante.html">
     <br> <button>Finalizar pagamento</button>
    </a>

</main>
